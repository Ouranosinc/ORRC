main:
  logging_dir: "code/processed/orrc_logs"
  staging_dir: "code/staging"
  reconstruction_dir: "reconstruction"
  working_dir: "code/tmp_workdir"

biasadjust:
  overwrite: False   
  frequency: day
  domain: NAM 
  apply_on: "staging"    # "staging" or "url"
  biasadj_product:
    v1.0:
      source: ORRC
      version: v1.0
      url: ""
  ref_product:
    v1.0:
      source: CaSR
      version: v3.2
      url: "https://pavics.ouranos.ca/twitcher/ows/proxy/thredds/dodsC/datasets/reanalyses/day_NAM_GovCan_CaSR_v32_1980-2024.ncml"
  ref_period:
    v1.0:
      start_date: 2020-01-01
      end_date: 2024-12-31
  variables:
    tas:
      training_args:
        method: Scaling
        grouper:
          group: time.dayofyear
          window: 31
          group_abbr: doy
        kind: "+"
    tasmax:
      training_args:
        method: Scaling
        grouper:
          group: time.dayofyear
          window: 31
          group_abbr: doy
        kind: "+"
    tasmin:
      training_args:
        method: Scaling
        grouper:
          group: time.dayofyear
          window: 31
          group_abbr: doy
        kind: "+"
    pr:  
      training_args:
        method: Scaling
        grouper:
          group: time.dayofyear
          window: 31
          group_abbr: doy
        kind: "*"

attrs:
  Conventions: "CF-1.8"
  Remarks: "Original variable names are following the convention <Product>_<Type:A=Analysis,P=Prediction>_<ECCC name>_<Level/Tile/Category>. Variables with level '10000' are at surface level. The height [m] of variables with level '0XXXX' needs to be inferrred using the corresponding fields of geopotential height (GZ_0XXXX-GZ_10000). The variables UUC, VVC, UVC, and WDC are not modelled but inferred from UU and VV for convenience of the users. Precipitation (PR) is reported as 6-hr accumulations for CaPA_fine and CaPA_coarse. Precipitation (PR) are accumulations since beginning of the forecast for GEPS, GDPS, REPS, RDPS, HRDPS, and CaLDAS. The re-analysis product ORRC contains two variables for precipitation: 'RDPS_CaPA_P_PR_SFC' is the model precipitation (trial field used by CaPA) and 'RDPS_CaPA_A_PR_SFC' is precipitations adjusted with CaPA 6h precipitation. Please be aware that the baseflow 'O1' of the current version of WCPS is not reliable during the spring melt period."
  bias_adjust_method : ""
  bias_adjust_project: ""
  bias_adjust_reference : ""
  contact: "bese.asli@ouranos.ca"
  doi: ""
  domain: "NAM"
  frequency: "day"
  institution : "Ouranos"
  licence_type : "open"
  license: "https://creativecommons.org/licenses/by/4.0/deed.en"
  prefix: "RDPS_CaPA_"
  processing_level : "raw"    # so that path structure is correct
  realm: "atmos"
  source: "ORRC-a"
  terms_of_use: "ORRC-a data users should acknowledge The Canadian Surface Prediction Archive (CaSPAr) as the original data source (https://caspar-data.ca/, https://doi.org/10.1175/BAMS-D-19-0143.1)"
  type: "reconstruction"
  version: ""
